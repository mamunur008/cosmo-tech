<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Cosmo Tech contact form</title></head>
  <body>
    <!-- Static blueprint used by Netlify's deploy-time form detection. -->
    <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact">
      <input name="bot-field"><input name="name"><input name="organization">
      <input type="email" name="email"><input name="phone">
      <select name="service"><option>Contact enquiry</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
